
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamera Absensi - BNNP Sulsel</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172b4d;
    }

    .card {
      max-width: 520px;
      margin: 10px auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000012;
    }

    h2 { margin-top: 0; color: #12366a; }

    video, canvas, #preview {
      display: block;
      width: 100%;
      border-radius: 10px;
      background: #202428;
    }

    video {
      min-height: 220px;
      max-height: 55vh;
      object-fit: cover;
    }

    canvas, #preview { display: none; }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      color: white;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #captureBtn { background: #168653; }
    #retakeBtn { background: #667085; }
    #sendBtn { background: #ffb900; color: #172b4d; }

    #status {
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Kamera Absensi BNNP Sulsel</h2>
    <p>Posisikan wajah di tengah kamera, lalu ambil foto.</p>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <img id="preview" alt="Pratinjau foto absensi">

    <button id="captureBtn" disabled>Ambil Foto</button>
    <button id="retakeBtn" hidden>Ambil Ulang</button>
    <button id="sendBtn" hidden>Gunakan Foto Ini</button>

    <p id="status">Menyiapkan kamera...</p>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');

    const captureBtn = document.getElementById('captureBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const sendBtn = document.getElementById('sendBtn');

    const params = new URLSearchParams(window.location.search);
    const parentOrigin = params.get('parentOrigin');

    let stream = null;
    let photoData = '';
    let cameraStarting = false;

    function allowedParentOrigin(value) {
      try {
        const u = new URL(value);

        return u.protocol === 'https:' &&
          (
            u.hostname === 'script.google.com' ||
            u.hostname.endsWith('.script.googleusercontent.com')
          );
      } catch (e) {
        return false;
      }
    }

    async function startCamera() {
      if (cameraStarting || stream) return;
      cameraStarting = true;

      if (!window.isSecureContext) {
        statusEl.textContent =
          'Kamera memerlukan koneksi HTTPS.';
        cameraStarting = false;
        return;
      }

      if (!navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent =
          'Browser tidak menyediakan akses kamera. Periksa izin dan kebijakan iframe.';
        cameraStarting = false;
        return;
      }

      statusEl.textContent = 'Meminta izin kamera...';

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        captureBtn.disabled = false;
        statusEl.textContent = 'Kamera aktif. Silakan ambil foto.';
      } catch (err) {
        console.error(
          'Kesalahan kamera:',
          err.name,
          err.message
        );

        if (err.name === 'NotAllowedError') {
          statusEl.textContent =
            'Akses kamera ditolak atau diblokir browser/iframe. Periksa izin kamera dan kebijakan hosting.';
        } else if (err.name === 'NotFoundError') {
          statusEl.textContent =
            'Kamera tidak ditemukan pada perangkat ini.';
        } else if (err.name === 'NotReadableError') {
          statusEl.textContent =
            'Kamera sedang digunakan aplikasi lain atau tidak dapat diakses.';
        } else {
          statusEl.textContent =
            'Kamera gagal dibuka: ' +
            err.name + ' - ' + err.message;
        }

        stopCamera();
      } finally {
        cameraStarting = false;
      }
    }

    captureBtn.addEventListener('click', function() {
      if (!stream || !video.videoWidth) {
        statusEl.textContent =
          'Kamera belum siap. Tunggu sampai video muncul.';
        return;
      }

      const scale = Math.min(1, 960 / video.videoWidth);

      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);

      const context = canvas.getContext('2d');

      if (!context) {
        statusEl.textContent = 'Gagal memproses gambar.';
        return;
      }

      context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );

      photoData = canvas.toDataURL('image/png');

      preview.src = photoData;
      preview.style.display = 'block';
      video.style.display = 'none';

      captureBtn.hidden = true;
      retakeBtn.hidden = false;
      sendBtn.hidden = false;

      statusEl.textContent =
        'Periksa foto, lalu tekan Gunakan Foto Ini.';
    });

    retakeBtn.addEventListener('click', function() {
      photoData = '';
      preview.removeAttribute('src');
      preview.style.display = 'none';
      video.style.display = 'block';

      captureBtn.hidden = false;
      retakeBtn.hidden = true;
      sendBtn.hidden = true;

      statusEl.textContent = 'Silakan ambil foto ulang.';
    });

    sendBtn.addEventListener('click', function() {
      if (!photoData) {
        statusEl.textContent = 'Ambil foto terlebih dahulu.';
        return;
      }

      if (!allowedParentOrigin(parentOrigin)) {
        statusEl.textContent =
          'Alamat aplikasi tidak valid. Buka kamera dari aplikasi magang.';
        return;
      }

      // Kirim foto asli ke halaman utama melalui iframe.
      window.parent.postMessage({
        type: 'BNNP_ABSENSI_PHOTO',
        photoData: photoData
      }, parentOrigin);

      statusEl.textContent =
        'Foto dikirim. Tunggu proses validasi dan penyimpanan absensi.';

      stopCamera();

      sendBtn.disabled = true;
      captureBtn.disabled = true;
      retakeBtn.disabled = true;
    });

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(function(track) {
          track.stop();
        });

        stream = null;
      }

      video.srcObject = null;
    }

    window.addEventListener('pagehide', stopCamera);

    // Mulai kamera saat halaman dimuat.
    startCamera();
  </script>
</body>
</html>
